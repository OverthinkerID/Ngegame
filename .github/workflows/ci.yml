name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Build, & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @ngegame/shared

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Sync SQLite Database Schema
        env:
          DATABASE_URL: "file:./dev.db"
        run: npm run db:push

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Run unit & integration tests (Node + Python)
        env:
          DATABASE_URL: "file:./dev.db"
        run: npm test
