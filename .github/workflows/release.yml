name: Release Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Verify & Build Windows NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies & electron-builder
        run: |
          npm ci
          npm install --no-save electron-builder

      - name: Build shared package
        run: npm run build -w @ngegame/shared

      - name: Generate Prisma Client & Sync SQLite Schema
        env:
          DATABASE_URL: "file:./dev.db"
        run: |
          npm run db:generate
          npm run db:push

      - name: TypeScript check, Production Build, & Tests
        env:
          DATABASE_URL: "file:./dev.db"
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Prepare Clean SQLite Template DB
        env:
          DATABASE_URL: "file:./template.sqlite"
        run: npm run db:push

      - name: Package Windows NSIS Installer
        run: npx electron-builder --win --x64 --publish never

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe, release\*.blockmap, release\latest.yml -ErrorAction SilentlyContinue |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Out-File -FilePath release\SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          retention-days: 14

      - name: Upload Draft Pre-Release (Tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
