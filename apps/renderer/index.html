<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overthinker-Ngegame — Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('ngegame-theme-mode') || 'dark';
          var raw = localStorage.getItem('ngegame-theme-snapshot');
          document.documentElement.setAttribute('data-theme', mode === 'light' ? 'light' : 'dark');
          if (raw) {
            var snap = JSON.parse(raw);
            if (snap && typeof snap === 'object') {
              if (snap.accentColor) document.documentElement.style.setProperty('--accent-primary', snap.accentColor);
              if (snap.secondaryColor) document.documentElement.style.setProperty('--accent-secondary', snap.secondaryColor);
              if (snap.mode === 'custom' && snap.backgroundColor) document.documentElement.style.setProperty('--bg-main', snap.backgroundColor);
            }
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
