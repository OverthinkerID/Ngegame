appId: com.overthinker.ngegame
productName: Overthinker-Ngegame
copyright: Copyright © 2026 Overthinker Studio
directories:
  output: release
  buildResources: apps/desktop/assets
asar: true
asarUnpack:
  - apps/python-worker/**/*
  - apps/backend/prisma/**/*
  - node_modules/.prisma/**/*
  - node_modules/@prisma/**/*
files:
  - apps/desktop/dist/**/*
  - apps/desktop/dist-preload/**/*
  - apps/desktop/assets/**/*
  - apps/desktop/package.json
  - apps/renderer/dist/**/*
  - apps/backend/dist/**/*
  - apps/backend/prisma/schema.prisma
  - apps/backend/prisma/template.sqlite
  - apps/backend/package.json
  - apps/python-worker/**/*
  - packages/shared/dist/**/*
  - packages/shared/package.json
  - node_modules/**/*
  - "!node_modules/@ngegame/**"
  - from: packages/shared
    to: node_modules/@ngegame/shared
    filter:
      - dist/**/*
      - package.json
  - "!**/*.db*"
  - "!**/.env*"
  - "!**/backups/**"
  - "!**/*.log"
  - "!**/__pycache__/**"
extraMetadata:
  main: apps/desktop/dist/main.js
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: apps/desktop/assets/icon.ico
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Overthinker-Ngegame
  installerIcon: apps/desktop/assets/icon.ico
  uninstallerIcon: apps/desktop/assets/icon.ico
mac:
  target:
    - dmg
    - zip
  category: public.app-category.games
  icon: apps/desktop/assets/icon.png
